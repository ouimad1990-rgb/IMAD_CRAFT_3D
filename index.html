<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IMAD CRAFT 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}
#top{position:fixed;top:10px;left:0;right:0;text-align:center;color:white;
font-size:23px;font-weight:bold;text-shadow:2px 2px #222;pointer-events:none}
#help{position:fixed;top:44px;left:0;right:0;text-align:center;color:white;
text-shadow:1px 1px #222;font-size:12px;pointer-events:none}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;
justify-content:space-between;align-items:flex-end;pointer-events:none}
.group{display:grid;gap:5px;pointer-events:auto}
.left{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px}
.right{grid-template-columns:58px 58px;grid-template-rows:48px 48px}
button{border:2px solid #fff9;border-radius:12px;background:#243b2dbb;
color:white;font-size:19px;font-weight:bold;touch-action:none}
button:active{background:#72a94b}
#up{grid-column:2}#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#jump{font-size:13px}#break{font-size:13px}#place{font-size:13px}
#status{position:fixed;top:68px;left:8px;color:white;background:#0006;
padding:5px 8px;border-radius:6px;font-size:12px}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
color:white;font-size:24px;text-shadow:1px 1px black;pointer-events:none}
#look{position:fixed;inset:100px 0 100px 38%;z-index:1}
#controls{z-index:3}#top,#help,#status,#cross{z-index:4}
</style>
</head>
<body>
<div id="top">IMAD CRAFT 3D</div>
<div id="help">حرّك الكاميرا باللمس • ابنِ عالمك!</div>
<div id="status">جارٍ تحميل العالم...</div>
<div id="cross">+</div>
<div id="look"></div>

<div id="controls">
  <div class="group left">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div class="group right">
    <button id="jump">قفز</button>
    <button id="break">كسر</button>
    <button id="place">بناء</button>
    <button id="change">نوع<br>المكعب</button>
  </div>
</div>
